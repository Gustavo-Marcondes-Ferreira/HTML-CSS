<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        Table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            text-align: center;
        }

        td {
            border: 1px solid black;
            padding: 6px;
            vertical-align: middle;
            
        }

        tr.par {
            background-color: rgba(128, 128, 128, 0.438);
        }
        td:hover {
            border: 3px solid red;
        }
    </style>
</head>
<body>
    <h1>Minha primeira Tabela</h1>
    <!--
        Hierarquia de tabelas simples
        Table = tabela
            Table Row
                Table Header
                Table Data
    -->
    <Table>
        <Tr> <!-- Primeira Linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </Tr>
        <tr class="par">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
         <tr class="par">
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </Table>
    </Table>
</body>
</html>
